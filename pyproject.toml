[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-bot-dashboard"
version = "0.1.0"
description = "A YouTube live-chat reply dashboard and conservative comment-cleanup core."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "YouTube Bot Dashboard contributors"}]
dependencies = ["SQLAlchemy>=2.0,<3.0", "streamlit>=1.66.0,<2.0", "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ai = ["google-genai>=1.0", "openai>=1.0"]
youtube = ["google-api-python-client>=2.120", "google-auth>=2.28", "google-auth-oauthlib>=1.2", "grpcio>=1.60", "grpcio-tools>=1.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
